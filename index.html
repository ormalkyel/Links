<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Or Malkyel | Official Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 32px 16px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 15%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, rgba(9, 10, 15, 0) 70%);
      z-index: 0;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .avatar-wrapper {
      position: relative;
      margin-bottom: 20px;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      background-color: #171923;
    }

    .badge {
      position: absolute;
      bottom: 2px;
      right: 2px;
      background: #10b981;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2.5px solid var(--bg);
    }

    .name {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      color: #ffffff;
      text-align: center;
    }

    .bio {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.5;
      margin-bottom: 28px;
      direction: ltr;
    }

    .links-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      text-decoration: none;
      color: var(--text-main);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .link-card:hover {
      background: var(--card-hover);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .link-card:active {
      transform: scale(0.985);
    }

    .link-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon-box {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      flex-shrink: 0;
    }

    .link-text {
      text-align: right;
    }

    .link-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 2px;
    }

    .link-desc {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .arrow-icon {
      color: var(--text-muted);
      opacity: 0.6;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .link-card:hover .arrow-icon {
      transform: translateX(-3px);
      opacity: 1;
      color: #ffffff;
    }

    .footer {
      margin-top: 36px;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.25);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <main class="container">
    <div class="avatar-wrapper">
      <img class="avatar" src="https://unavatar.io/x/ormalkyel" alt="Or Malkyel" onerror="this.src='https://ui-avatars.com/api/?name=Or+Malkyel&background=18181b&color=fff&size=192'">
      <div class="badge" title="Active"></div>
    </div>

    <h1 class="name">Or Malkyel Mirzayev</h1>
    <p class="bio">Futures Trader & Digital Entrepreneur<br>Tel Aviv, Israel</p>

    <div class="links-group">

      <!-- LinkedIn -->
      <a href="https://www.linkedin.com/in/or-malkyel-mirzayev-b75204344/" target="_blank" rel="noopener noreferrer" class="link-card">
        <div class="link-info">
          <div class="icon-box">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>
            </svg>
          </div>
          <div class="link-text">
            <div class="link-title">LinkedIn</div>
            <div class="link-desc">Professional Profile & Network</div>
          </div>
        </div>
        <svg class="arrow-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </a>

      <!-- X / Twitter -->
      <a href="https://x.com/ormalkyel" target="_blank" rel="noopener noreferrer" class="link-card">
        <div class="link-info">
          <div class="icon-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
            </svg>
          </div>
          <div class="link-text">
            <div class="link-title">X (Twitter)</div>
            <div class="link-desc">Thoughts, Market Insights & Mindset</div>
          </div>
        </div>
        <svg class="arrow-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </a>

      <!-- JoinProp Interview -->
      <a href="https://joinprop.com/academy/one-prop-trader-a-day-the-ultra-marathoner-who-trades-once-a-day/" target="_blank" rel="noopener noreferrer" class="link-card">
        <div class="link-info">
          <div class="icon-box">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
          </div>
          <div class="link-text">
            <div class="link-title">הריאיון שלי ל-JoinProp</div>
            <div class="link-desc">One Prop Trader a Day | The Ultra-Marathoner</div>
          </div>
        </div>
        <svg class="arrow-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </a>

    </div>

    <div class="footer">
      © Or Malkyel
    </div>
  </main>

</body>
</html>
